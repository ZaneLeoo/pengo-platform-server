name: pm

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: pm
      MYSQL_USER: pm_app
      MYSQL_PASSWORD: ${PM_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${PM_DB_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --lower-case-table-names=1
    volumes:
      - pm_mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [pm_data]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${PM_REDIS_PASSWORD}"]
    volumes:
      - pm_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$PM_REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
    environment:
      PM_REDIS_PASSWORD: ${PM_REDIS_PASSWORD}
    networks: [pm_data]

  backend:
    image: eclipse-temurin:17-jre
    restart: unless-stopped
    working_dir: /app
    command: ["java", "-Xms512m", "-Xmx1536m", "-jar", "/app/ruoyi-admin.jar"]
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: druid,prod
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/config/
      PM_SERVER_ADDRESS: 0.0.0.0
      PM_SERVER_PORT: 8088
      PM_DB_HOST: mysql
      PM_DB_PORT: 3306
      PM_DB_NAME: pm
      PM_DB_USERNAME: pm_app
      PM_DB_PASSWORD: ${PM_DB_PASSWORD}
      PM_REDIS_HOST: redis
      PM_REDIS_PORT: 6379
      PM_REDIS_DATABASE: 0
      PM_REDIS_PASSWORD: ${PM_REDIS_PASSWORD}
      PM_TOKEN_SECRET: ${PM_TOKEN_SECRET}
      PM_UPLOAD_PATH: /data/uploads
      PM_LOG_FILE: /data/logs/backend.log
    volumes:
      - ./current/backend/ruoyi-admin.jar:/app/ruoyi-admin.jar:ro
      - ./config:/config:ro
      - ./data/uploads:/data/uploads
      - ./data/logs:/data/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose: ["8088"]
    networks: [pm_data, pm_edge]

  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "9000:80"
    volumes:
      - ./current/frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend]
    networks: [pm_edge]

networks:
  pm_data:
    internal: true
  pm_edge:
    driver: bridge

volumes:
  pm_mysql_data:
  pm_redis_data:
